name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z source tag to publish as vX.Y.Z-amd64; empty is build-only
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: container-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Validate requested release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$RELEASE_TAG" == "v$(cat VERSION)" ]]
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install deployment configuration test tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ansible-core
      - name: Validate deployment configuration
        run: node --test tests/deployment.test.cjs
      - name: Test and build React and Java (4 CPU regression)
        env:
          JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4
        run: bash scripts/build-java.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Select image tags
        id: image
        env:
          IMAGE: ghcr.io/sepa79/pocketplanner
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          revision="$(git rev-parse HEAD)"
          tags=("${IMAGE}:latest" "${IMAGE}:sha-${revision}-amd64")
          version="$(cat VERSION)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]] || exit 1
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$RELEASE_TAG" == "v${version}" ]] || exit 1
            tags+=("${IMAGE}:${RELEASE_TAG}")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$RELEASE_TAG" == "v${version}" ]] || exit 1
            tags+=("${IMAGE}:${RELEASE_TAG}-amd64")
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${tags[@]}")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PocketPlanner
            org.opencontainers.image.source=https://github.com/sepa79/PocketPlanner
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Verify published amd64 runtime
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          IMAGE: ghcr.io/sepa79/pocketplanner@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          bash scripts/smoke-image.sh "$IMAGE" "$VERSION" linux/amd64
